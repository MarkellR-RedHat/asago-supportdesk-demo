[project]
name = "asago-supportdesk-demo"
version = "0.1.0"
description = "A throwaway support agent and the MiDojo suite that red-teams it"
requires-python = ">= 3.12"
license = "Apache-2.0"
dependencies = [
    "midojo[suites] @ git+https://github.com/asago-ai/midojo.git@8ffbee4",
    # Match midojo's own uv.lock at that commit; newer majors rename client APIs.
    "mcp==1.27.0",
    "fastmcp==3.2.4",
    "a2a-sdk==1.0.2",
]

[project.scripts]
supportdesk-real-mcp = "supportdesk.real_mcp:main"
supportdesk-fake-mcp = "supportdesk.fake_mcp:main"
supportdesk-agent = "supportdesk.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["supportdesk"]
