apiVersion: batch/v1
kind: Job
metadata:
  name: supportdesk-redteam
  labels:
    app.kubernetes.io/part-of: asago-supportdesk
    app.kubernetes.io/component: orchestrator
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: asago-supportdesk
        app.kubernetes.io/component: orchestrator
    spec:
      restartPolicy: OnFailure
      containers:
        - name: orchestrator
          image: supportdesk
          command: ["sh", "-c"]
          args:
            - |
              python - <<'PY'
              import time, urllib.request
              for _ in range(60):
                  try:
                      urllib.request.urlopen("http://supportdesk-agent:8000/.well-known/agent-card.json", timeout=3)
                      break
                  except Exception:
                      print("waiting for agent..."); time.sleep(5)
              PY
              midojo-run \
                --control-url http://supportdesk-control-plane:8080 \
                --agent-uri http://supportdesk-agent:8000 \
                --protocol a2a \
                --suite supportdesk.suite_module \
                --logdir /tmp/runs
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
