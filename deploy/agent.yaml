apiVersion: apps/v1
kind: Deployment
metadata:
  name: supportdesk-agent
  labels:
    app.kubernetes.io/part-of: asago-supportdesk
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: asago-supportdesk
        app.kubernetes.io/component: agent
    spec:
      containers:
        - name: agent
          image: supportdesk
          command: ["supportdesk-agent", "--host", "0.0.0.0"]
          env:
            # The agent talks to the FAKE MCP server (the interception layer).
            - name: MCP_SERVER_URL
              value: http://supportdesk-fake-mcp:8082/mcp
            - name: AGENT_PUBLIC_URL
              value: http://supportdesk-agent:8000/
            - name: SUPPORTDESK_PROMPT_FIX
              value: "0"
          envFrom:
            # LITELLM_API_KEY / LITELLM_API_URL / LITELLM_MODEL: your vLLM or MaaS endpoint.
            - secretRef:
                name: supportdesk-llm-creds
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: supportdesk-agent
  labels:
    app.kubernetes.io/part-of: asago-supportdesk
spec:
  selector:
    app.kubernetes.io/component: agent
  ports:
    - port: 8000
      targetPort: 8000
